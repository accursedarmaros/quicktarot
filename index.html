<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Premium Tarot Card Widget</title>
  <style>
    body {
      background-color: #121214;
      color: #fdf6e3;
      font-family: 'Georgia', serif;
      text-align: center;
      padding: 40px;
    }
    .tarot-widget {
      background-color: #1e1e2f;
      padding: 30px;
      border-radius: 20px;
      width: 320px;
      margin: 0 auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      border: 1px solid #3a3a52;
    }
    .card-button {
      background: linear-gradient(135deg, #5b446a, #3b2d4a);
      color: #fff;
      border: 1px solid #7b5e8c;
      padding: 12px 25px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 25px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      margin-top: 20px;
      transition: all 0.3s ease;
    }
    .card-button:hover {
      background: linear-gradient(135deg, #7b5e8c, #5b446a);
      box-shadow: 0 6px 20px rgba(123, 94, 140, 0.4);
      transform: translateY(-2px);
    }
    .card-container {
      perspective: 1000px;
      width: 100%;
      height: 440px; 
      margin-top: 25px;
    }
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d;
    }
    .card-inner.is-flipped {
      transform: rotateY(180deg);
    }
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      overflow: hidden;
      box-sizing: border-box;
    }
    .card-front {
      background-color: #252538;
      border: 4px double #7b5e8c;
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card-back {
      background: repeating-linear-gradient(45deg, #2b2b3a, #2b2b3a 10px, #232330 10px, #232330 20px);
      border: 4px double #5b446a;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-back::after {
      content: "✨";
      font-size: 50px;
      opacity: 0.6;
    }
    .sigil-display {
      font-size: 80px;
      margin: 20px 0;
      transition: transform 0.5s ease;
      filter: drop-shadow(0 0 10px rgba(123, 94, 140, 0.5));
    }
    .sigil-display.reversed {
      transform: rotate(180deg);
    }
    .card-front-title {
      font-size: 24px;
      color: #fdf6e3;
      margin: 10px 0;
    }
    .message {
      margin-top: 25px;
      font-size: 18px;
      min-height: 60px;
      line-height: 1.5;
    }
    .status-tag {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      display: block;
      margin-bottom: 5px;
    }
    .upright-text { color: #4ade80; }
    .reversed-text { color: #f87171; }
  </style>
</head>
<body>

  <div class="tarot-widget">
    <h2>🔮 quicktarot</h2>
    
    <div class="card-container">
      <div class="card-inner" id="cardInner">
        <div class="card-face card-back"></div>
        <div class="card-face card-front">
          <div id="cardSigil" class="sigil-display">✨</div>
          <div id="cardTitle" class="card-front-title">The Card</div>
        </div>
      </div>
    </div>

    <button class="card-button" onclick="drawCard()">Draw Card</button>
    <div class="message" id="tarotMessage">Click the button to reveal your fate.</div>
  </div>

  <script>
  const cards = [
    { name: "The Fool", sigil: "🃏", upright: "New beginnings, optimism, trust in life.", reversed: "Recklessness, risk-taking, holding back." },
    { name: "The Magician", sigil: "🪄", upright: "Manifestation, willpower, desire, resourcefulness.", reversed: "Illusion, out of touch, wasted talent." },
    { name: "The High Priestess", sigil: "🌙", upright: "Intuition, sacred knowledge, divine feminine, subconscious.", reversed: "Secret motives, surface-level thinking, ignoring intuition." },
    { name: "The Empress", sigil: "🌱", upright: "Abundance, creativity, nature, nurturing.", reversed: "Dependence, creative block, smothering." },
    { name: "The Emperor", sigil: "👑", upright: "Authority, structure, solid foundation, protection.", reversed: "Tyranny, rigidity, coldness, lack of discipline." },
    { name: "The Hierophant", sigil: "📜", upright: "Tradition, conformity, spiritual wisdom, institutions.", reversed: "Rebellion, subversion, new approaches." },
    { name: "The Lovers", sigil: "❤️", upright: "Harmony, choices, alignment of values, relationships.", reversed: "Disharmony, misalignment, imbalance." },
    { name: "The Chariot", sigil: "🛒", upright: "Control, willpower, success, determination, action.", reversed: "Lack of control, opposition, lack of direction." },
    { name: "Strength", sigil: "🦁", upright: "Courage, inner strength, influence, compassion.", reversed: "Self-doubt, raw emotion, weakness." },
    { name: "The Hermit", sigil: "🏮", upright: "Soul-searching, inner guidance, solitude, reflection.", reversed: "Loneliness, isolation, paranoia." },
    { name: "Wheel of Fortune", sigil: "🎡", upright: "Good luck, karma, life cycles, destiny, turning point.", reversed: "Bad luck, resisting change, breaking cycles." },
    { name: "Justice", sigil: "⚖️", upright: "Fairness, truth, cause and effect, law.", reversed: "Dishonesty, lack of accountability, unfairness." },
    { name: "The Hanged Man", sigil: "⏳", upright: "Pause, surrender, letting go, new perspectives.", reversed: "Stagnation, waiting, stalling, ego resistance." },
    { name: "Death", image: "deathtarot.jpg", upright: "Endings, change, transformation, transition.", reversed: "Resistance to change, personal stagnation, decaying ties." },
    { name: "Temperance", sigil: "⚗️", upright: "Balance, moderation, patience, purpose.", reversed: "Imbalance, excess, misalignment." },
    { name: "The Devil", sigil: "🔥", upright: "Shadow self, attachment, addiction, restriction.", reversed: "Detaching, reclaiming control, dark night of the soul." },
    { name: "The Tower", sigil: "⚡", upright: "Sudden change, upheaval, chaos, revelation.", reversed: "Avoiding disaster, delaying the inevitable, fear of suffering." },
    { name: "The Star", sigil: "⭐", upright: "Hope, faith, purpose, renewal, spirituality.", reversed: "Despair, lack of faith, discouragement." },
    { name: "The Moon", sigil: "🐺", upright: "Illusion, fear, anxiety, subconscious, intuition.", reversed: "Release of fear, uncovering secrets, confusion clears." },
    { name: "The Sun", sigil: "☀️", upright: "Positivity, fun, warmth, success, vitality.", reversed: "Inner child blocks, temporary depression, unrealistic optimism." },
    { name: "Judgement", sigil: "🔔", upright: "Reflection, reckoning, awakening, absolution.", reversed: "Self-doubt, inner critic, ignoring the call." },
    { name: "The World", sigil: "🌍", upright: "Completion, integration, accomplishment, travel.", reversed: "Seeking closure, shortcuts, incomplete goals." }
  ];

  function drawCard() {
    const cardInner = document.getElementById('cardInner');
    const sigilDisplay = document.getElementById('cardSigil');
    const titleDisplay = document.getElementById('cardTitle');
    const messageDiv = document.getElementById('tarotMessage');
    
    cardInner.classList.remove('is-flipped');
    sigilDisplay.classList.remove('reversed');
    
    setTimeout(() => {
      const card = cards[Math.floor(Math.random() * cards.length)];
      const isReversed = Math.random() < 0.5;
      
      titleDisplay.innerText = card.name;
      sigilDisplay.innerText = card.sigil;
      
      if (isReversed) {
        sigilDisplay.classList.add('reversed');
        messageDiv.innerHTML = `<span class="status-tag reversed-text">Reversed</span><strong>${card.name}</strong>: ${card.reversed}`;
      } else {
        messageDiv.innerHTML = `<span class="status-tag upright-text">Upright</span><strong>${card.name}</strong>: ${card.upright}`;
      }
      
      cardInner.classList.add('is-flipped');
    }, 150);
  }
  </script>

  <div style="text-align: center; margin-top: 40px; padding-bottom: 20px; opacity: 0.7;">
      <img src="https://hits.sh/accursedarmaros.github.io/quicktarot.svg?style=flat-square&text=visitors" alt="Hits"/>
  </div>
</body>
</html>
