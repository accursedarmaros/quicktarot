<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Premium Tarot Card Widget</title>
  <style>
    body {
      background-color: #121214;
      color: #fdf6e3;
      font-family: 'Georgia', serif;
      text-align: center;
      padding: 40px;
    }
    .tarot-widget {
      background-color: #1e1e2f;
      padding: 30px;
      border-radius: 20px;
      width: 320px;
      margin: 0 auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      border: 1px solid #3a3a52;
    }
    .card-button {
      background: linear-gradient(135deg, #5b446a, #3b2d4a);
      color: #fff;
      border: 1px solid #7b5e8c;
      padding: 12px 25px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 25px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      margin-top: 20px;
      transition: all 0.3s ease;
    }
    .card-button:hover {
      background: linear-gradient(135deg, #7b5e8c, #5b446a);
      box-shadow: 0 6px 20px rgba(123, 94, 140, 0.4);
      transform: translateY(-2px);
    }
    .card-container {
      perspective: 1000px;
      width: 100%;
      height: 480px; 
      margin-top: 25px;
    }
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d;
    }
    .card-inner.is-flipped {
      transform: rotateY(180deg);
    }
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      overflow: hidden;
    }
    .card-front {
      background-color: #2b2b3a;
      transform: rotateY(180deg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-back {
      background: repeating-linear-gradient(45deg, #2b2b3a, #2b2b3a 10px, #232330 10px, #232330 20px);
      border: 4px double #5b446a;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-back::after {
      content: "✨";
      font-size: 50px;
      opacity: 0.6;
    }
    .tarot-img {
      width: 100%;
      height: 100%;
      object-fit: contain; 
      background-color: #000;
      transition: transform 0.5s ease;
    }
    .tarot-img.reversed {
      transform: rotate(180deg);
    }
    .message {
      margin-top: 25px;
      font-size: 18px;
      min-height: 60px;
      line-height: 1.5;
    }
    .status-tag {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      display: block;
      margin-bottom: 5px;
    }
    .upright-text { color: #4ade80; }
    .reversed-text { color: #f87171; }
  </style>
</head>
<body>

  <div class="tarot-widget">
    <h2>🔮 quicktarot</h2>
    
    <div class="card-container">
      <div class="card-inner" id="cardInner">
        <div class="card-face card-back"></div>
        <div class="card-face card-front">
          <img id="tarotImg" src="" alt="" class="tarot-img"/>
        </div>
      </div>
    </div>

    <button class="card-button" onclick="drawCard()">Draw Card</button>
    <div class="message" id="tarotMessage">Click the button to reveal your fate.</div>
  </div>

  <script>
  const cards = [
    { name: "The Fool", image: "https://yunru.se/tarot/cards/color/ar00.png", upright: "New beginnings, optimism, trust in life.", reversed: "Recklessness, risk-taking, holding back." },
    { name: "The Magician", image: "https://yunru.se/tarot/cards/color/ar01.png", upright: "Manifestation, willpower, desire, resourcefulness.", reversed: "Illusion, out of touch, wasted talent." },
    { name: "The High Priestess", image: "https://yunru.se/tarot/cards/color/ar02.png", upright: "Intuition, sacred knowledge, divine feminine, subconscious.", reversed: "Secret motives, surface-level thinking, ignoring intuition." },
    { name: "The Empress", image: "https://yunru.se/tarot/cards/color/ar03.png", upright: "Abundance, creativity, nature, nurturing.", reversed: "Dependence, creative block, smothering." },
    { name: "The Emperor", image: "https://yunru.se/tarot/cards/color/ar04.png", upright: "Authority, structure, solid foundation, protection.", reversed: "Tyranny, rigidity, coldness, lack of discipline." },
    { name: "The Hierophant", image: "https://yunru.se/tarot/cards/color/ar05.png", upright: "Tradition, conformity, spiritual wisdom, institutions.", reversed: "Rebellion, subversion, new approaches." },
    { name: "The Lovers", image: "https://yunru.se/tarot/cards/color/ar06.png", upright: "Harmony, choices, alignment of values, relationships.", reversed: "Disharmony, misalignment, imbalance." },
    { name: "The Chariot", image: "https://yunru.se/tarot/cards/color/ar07.png", upright: "Control, willpower, success, determination, action.", reversed: "Lack of control, opposition, lack of direction." },
    { name: "Strength", image: "https://yunru.se/tarot/cards/color/ar08.png", upright: "Courage, inner strength, influence, compassion.", reversed: "Self-doubt, raw emotion, weakness." },
    { name: "The Hermit", image: "https://yunru.se/tarot/cards/color/ar09.png", upright: "Soul-searching, inner guidance, solitude, reflection.", reversed: "Loneliness, isolation, paranoia." },
    { name: "Wheel of Fortune", image: "https://yunru.se/tarot/cards/color/ar10.png", upright: "Good luck, karma, life cycles, destiny, turning point.", reversed: "Bad luck, resisting change, breaking cycles." },
    { name: "Justice", image: "https://yunru.se/tarot/cards/color/ar11.png", upright: "Fairness, truth, cause and effect, law.", reversed: "Dishonesty, lack of accountability, unfairness." },
    { name: "The Hanged Man", image: "https://yunru.se/tarot/cards/color/ar12.png", upright: "Pause, surrender, letting go, new perspectives.", reversed: "Stagnation, waiting, stalling, ego resistance." },
    { name: "Death", image: "https://yunru.se/tarot/cards/color/ar13.png", upright: "Endings, change, transformation, transition.", reversed: "Resistance to change, personal stagnation, decaying ties." },
    { name: "Temperance", image: "https://yunru.se/tarot/cards/color/ar14.png", upright: "Balance, moderation, patience, purpose.", reversed: "Imbalance, excess, misalignment." },
    { name: "The Devil", image: "https://yunru.se/tarot/cards/color/ar15.png", upright: "Shadow self, attachment, addiction, restriction.", reversed: "Detaching, reclaiming control, dark night of the soul." },
    { name: "The Tower", image: "https://yunru.se/tarot/cards/color/ar16.png", upright: "Sudden change, upheaval, chaos, revelation.", reversed: "Avoiding disaster, delaying the inevitable, fear of suffering." },
    { name: "The Star", image: "https://yunru.se/tarot/cards/color/ar17.png", upright: "Hope, faith, purpose, renewal, spirituality.", reversed: "Despair, lack of faith, discouragement." },
    { name: "The Moon", image: "https://yunru.se/tarot/cards/color/ar18.png", upright: "Illusion, fear, anxiety, subconscious, intuition.", reversed: "Release of fear, uncovering secrets, confusion clears." },
    { name: "The Sun", image: "https://yunru.se/tarot/cards/color/ar19.png", upright: "Positivity, fun, warmth, success, vitality.", reversed: "Inner child blocks, temporary depression, unrealistic optimism." },
    { name: "Judgement", image: "https://yunru.se/tarot/cards/color/ar20.png", upright: "Reflection, reckoning, awakening, absolution.", reversed: "Self-doubt, inner critic, ignoring the call." },
    { name: "The World", image: "https://yunru.se/tarot/cards/color/ar21.png", upright: "Completion, integration, accomplishment, travel.", reversed: "Seeking closure, shortcuts, incomplete goals." }
  ];

  function drawCard() {
    const cardInner = document.getElementById('cardInner');
    const img = document.getElementById('tarotImg');
    const messageDiv = document.getElementById('tarotMessage');
    
    cardInner.classList.remove('is-flipped');
    img.classList.remove('reversed');
    
    setTimeout(() => {
      const card = cards[Math.floor(Math.random() * cards.length)];
      const isReversed = Math.random() < 0.5;
      
      // FIXED lines map to correct array variables now
      img.src = card.image;
      img.alt = card.name;
      
      if (isReversed) {
        img.classList.add('reversed');
        messageDiv.innerHTML = `<span class="status-tag reversed-text">Reversed</span><strong>${card.name}</strong>: ${card.reversed}`;
      } else {
        messageDiv.innerHTML = `<span class="status-tag upright-text">Upright</span><strong>${card.name}</strong>: ${card.upright}`;
      }
      
      cardInner.classList.add('is-flipped');
    }, 150);
  }
  </script>

  <div style="text-align: center; margin-top: 40px; padding-bottom: 20px; opacity: 0.7;">
      <img src="https://hits.sh/accursedarmaros.github.io/quicktarot.svg?style=flat-square&text=visitors" alt="Hits"/>
  </div>
</body>
</html>
